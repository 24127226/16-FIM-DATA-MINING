name: CI

on:
  push:
    branches: [main, cuong, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia 1.11.4
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.4"

      - name: Instantiate project
        run: julia --project=. -e "using Pkg; Pkg.instantiate()"

      - name: Run unit tests (default)
        run: julia --project=. test/runtests.jl

      - name: Run unit tests (--check-bounds=yes)
        run: julia --project=. --check-bounds=yes test/runtests.jl
